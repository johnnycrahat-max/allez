<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700;12..96,800&family=Figtree:wght@400;500;600;700&display=swap">
<style>
/* Layout: sticky header (brand, search, date chips) over a two-column body. Left: a sticky column of category tags (All / Music & Culture / Food / Volunteer / Saved). Right: each category in its own tinted panel, so the three never mix. Purple, cayenne and bayou green mark the categories. */
:root {
  /* Allez brand: Acadiana Navy #092B51, Festival Red #D51028, Sunshine Gold #FFBC00, Warm White #FAF9F6 */
  --bg: #FAF9F6;
  --surface: #FFFFFF;
  --surface-2: #EFEDE7;
  --ink: #092B51;
  --muted: #4F6077;
  --line: #E3DFD6;
  --logo-bg: transparent;
  --logo-blend: multiply;
  --music: #6233C9;
  --music-soft: #EEE8FC;
  --music-panel: #F5F1FE;
  --food: #D51028;
  --food-soft: #FCE4E7;
  --food-panel: #FEF4F5;
  --vol: #0C7A63;
  --vol-soft: #DCF2EA;
  --vol-panel: #EEF8F4;
  --health: #1B67AE;
  --health-soft: #E0EDFA;
  --health-panel: #F0F6FD;
  --music-solid: #5A2EBD;
  --food-solid: #D51028;
  --vol-solid: #0A6C58;
  --health-solid: #175C9C;
  --gold: #FFBC00;
  --warn: #8A5D00;
  --warn-soft: #FFF2CF;
  --shadow: 0 1px 2px rgba(21,32,27,.06), 0 6px 18px rgba(21,32,27,.06);
  --scrim: rgba(12,20,16,.45);
  --font-display: "Bricolage Grotesque", "Avenir Next", "Segoe UI", system-ui, sans-serif;
  --font-body: "Figtree", "Segoe UI", system-ui, -apple-system, sans-serif;
  --r-card: 16px;
  --r-chip: 999px;
  --head-h: 150px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #061A31; --surface: #0D2542; --surface-2: #143154; --ink: #FAF9F6; --muted: #A9B6C7; --line: #20406A; --logo-bg: #FAF9F6; --logo-blend: normal;
    --music: #B79BFF; --music-soft: #2C2250; --music-panel: #1B1730; --food: #FF6B78; --food-soft: #46141D; --food-panel: #2A0F17;
    --vol: #45CFAB; --vol-soft: #133A30; --vol-panel: #11241F;
    --health: #74B8FF; --health-soft: #16314D; --health-panel: #101C2A;
    --warn: #F2C14E; --warn-soft: #3A2E10; --shadow: 0 1px 2px rgba(0,0,0,.4); --scrim: rgba(0,0,0,.6);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #061A31; --surface: #0D2542; --surface-2: #143154; --ink: #FAF9F6; --muted: #A9B6C7; --line: #20406A; --logo-bg: #FAF9F6; --logo-blend: normal;
  --music: #B79BFF; --music-soft: #2C2250; --music-panel: #1B1730; --food: #FF6B78; --food-soft: #46141D; --food-panel: #2A0F17;
  --vol: #45CFAB; --vol-soft: #133A30; --vol-panel: #11241F;
  --health: #74B8FF; --health-soft: #16314D; --health-panel: #101C2A;
  --warn: #F2C14E; --warn-soft: #3A2E10; --shadow: 0 1px 2px rgba(0,0,0,.4); --scrim: rgba(0,0,0,.6);
  color-scheme: dark;
}

html, body { height: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font-family: var(--font-body); font-size: 15px; line-height: 1.45;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
  -webkit-font-smoothing: antialiased;
}
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--bg); }
button { font: inherit; color: inherit; }
:focus-visible { outline: 2.5px solid var(--ink); outline-offset: 2px; border-radius: 8px; }

.app { max-width: 820px; margin: 0 auto; padding-bottom: calc(32px + env(safe-area-inset-bottom, 0px)); }

/* Header */
.top { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--bg); padding-block: 14px 12px; display: grid; gap: 12px; }
.brand { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
.wordmark { display: flex; align-items: center; gap: 12px; min-width: 0; }
.logo { display: block; height: 52px; width: auto; max-width: 100%; mix-blend-mode: var(--logo-blend); background: var(--logo-bg); border-radius: 10px; }
.wordmark .place { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; color: var(--muted); border-left: 2px solid var(--food); padding-left: 10px; line-height: 1.35; }
.fresh { display: inline-flex; align-items: center; gap: 6px; font-size: 12px; color: var(--muted); background: var(--surface); border: 1px solid var(--line); padding: 6px 10px; border-radius: var(--r-chip); white-space: nowrap; }
.fresh i { width: 7px; height: 7px; border-radius: 50%; background: var(--vol); box-shadow: 0 0 0 3px var(--vol-soft); }
.search { position: relative; }
.search svg { position: absolute; left: 13px; top: 50%; transform: translateY(-50%); width: 18px; height: 18px; color: var(--muted); pointer-events: none; }
.search input { width: 100%; box-sizing: border-box; font: inherit; font-size: 15px; color: var(--ink); background: var(--surface); border: 1px solid var(--line); border-radius: 14px; padding: 11px 14px 11px 40px; }
.search input::placeholder { color: var(--muted); }
.ranges { display: flex; gap: 8px; overflow-x: auto; scrollbar-width: none; }
.ranges::-webkit-scrollbar { display: none; }
.range { flex: none; border: 1px solid var(--line); background: var(--surface); padding: 8px 14px; border-radius: var(--r-chip); font-weight: 600; font-size: 14px; cursor: pointer; }
.range[aria-pressed="true"] { background: var(--ink); color: var(--bg); border-color: var(--ink); }

/* Two-column body */
.layout { display: grid; grid-template-columns: 74px minmax(0, 1fr); gap: 12px; align-items: start; }

/* Left category rail */
.rail { position: sticky; top: calc(env(safe-area-inset-top, 0px) + var(--head-h) + 4px); display: grid; gap: 6px; }
.rail-btn { border: 0; background: transparent; cursor: pointer; display: grid; justify-items: center; gap: 4px; padding: 6px 2px 8px; border-radius: 16px; position: relative; text-align: center; }
.rail-btn .tile { width: 50px; height: 46px; border-radius: 15px; display: grid; place-items: center; background: var(--cat-soft); color: var(--cat); transition: background .15s, color .15s, transform .15s; }
.rail-btn .tile svg { width: 22px; height: 22px; }
.rail-btn .lbl { font-size: 11.5px; font-weight: 600; line-height: 1.15; color: var(--muted); text-wrap: balance; }
.rail-btn .num { position: absolute; top: 1px; right: 4px; min-width: 18px; height: 18px; padding: 0 5px; box-sizing: border-box; border-radius: 9px; background: var(--surface); border: 1.5px solid var(--cat); color: var(--cat); font-size: 10.5px; font-weight: 700; line-height: 15px; text-align: center; font-variant-numeric: tabular-nums; }
.rail-btn:hover .tile { transform: translateY(-1px); }
.rail-btn[aria-current="page"] .tile { background: var(--cat-solid); color: #fff; }
.rail-btn[aria-current="page"] .lbl { color: var(--cat); font-weight: 700; }
.rail-btn[aria-current="page"] .num { background: var(--cat-solid); color: #fff; border-color: var(--cat-solid); }
.rail hr { border: 0; border-top: 1px solid var(--line); margin: 2px 10px; }

/* Category color wiring */
[data-cat="music"] { --cat: var(--music); --cat-soft: var(--music-soft); --cat-solid: var(--music-solid); --cat-panel: var(--music-panel); }
[data-cat="food"] { --cat: var(--food); --cat-soft: var(--food-soft); --cat-solid: var(--food-solid); --cat-panel: var(--food-panel); }
[data-cat="volunteer"] { --cat: var(--vol); --cat-soft: var(--vol-soft); --cat-solid: var(--vol-solid); --cat-panel: var(--vol-panel); }
[data-cat="health"] { --cat: var(--health); --cat-soft: var(--health-soft); --cat-solid: var(--health-solid); --cat-panel: var(--health-panel); }
[data-cat="all"], [data-cat="saved"] { --cat: var(--ink); --cat-soft: var(--surface-2); --cat-solid: var(--ink); --cat-panel: var(--surface); }
[data-cat="saved"] .tile { color: var(--gold); }
[data-cat="saved"][aria-current="page"] .tile { color: var(--gold); }

/* Content */
.content { min-width: 0; display: grid; gap: 16px; }
.intro { display: grid; gap: 2px; padding-top: 4px; }
.intro h1 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 26px; letter-spacing: -.02em; line-height: 1.1; text-wrap: balance; }
.intro p { margin: 0; color: var(--muted); font-size: 14px; }

/* Category panel: each category lives in its own tinted block */
.panel { background: var(--cat-panel); border: 1px solid color-mix(in srgb, var(--cat) 22%, transparent); border-radius: 22px; padding: 0 10px 12px; display: grid; gap: 10px; overflow: hidden; }
.panel-head { margin: 0 -10px; padding: 12px 14px; background: var(--cat-solid); color: #fff; display: flex; align-items: center; gap: 10px; }
.panel-head .pi { width: 34px; height: 34px; border-radius: 11px; background: rgba(255,255,255,.18); display: grid; place-items: center; flex: none; }
.panel-head .pi svg { width: 19px; height: 19px; }
.panel-head .t { min-width: 0; flex: 1; display: grid; }
.panel-head .fr { font-size: 10.5px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; opacity: .8; }
.panel-head h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 20px; line-height: 1.1; letter-spacing: -.01em; }
.panel-head .pc { flex: none; background: rgba(255,255,255,.2); border-radius: var(--r-chip); padding: 4px 10px; font-size: 12.5px; font-weight: 700; font-variant-numeric: tabular-nums; }
.panel-sub { margin: 4px 2px 0; font-size: 12px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; color: var(--cat); display: flex; align-items: center; gap: 8px; }
.panel-sub .rel { background: var(--gold); color: #3A2600; padding: 2px 8px; border-radius: var(--r-chip); letter-spacing: .04em; font-size: 10.5px; }
.more { border: 1.5px solid var(--cat); background: transparent; color: var(--cat); border-radius: 12px; padding: 10px 12px; font-weight: 700; font-size: 14px; cursor: pointer; display: flex; align-items: center; justify-content: center; gap: 6px; }
.more:hover { background: var(--cat-soft); }
.more svg { width: 16px; height: 16px; }
.panel-empty { margin: 2px; padding: 16px; border: 1px dashed color-mix(in srgb, var(--cat) 35%, transparent); border-radius: 14px; color: var(--muted); font-size: 14px; text-align: center; }

/* Featured */
.feature { position: relative; overflow: hidden; border-radius: 18px; padding: 16px; color: #fff; background: var(--cat-solid); cursor: pointer; display: grid; gap: 8px; min-height: 140px; align-content: end; isolation: isolate; box-shadow: inset 0 0 0 1px rgba(255,255,255,.12); }
.feature::after { content: ""; position: absolute; inset: 0; z-index: -1; opacity: .55; }
.feature[data-cat="music"]::after { background: repeating-radial-gradient(circle at 88% 30%, rgba(255,255,255,.22) 0 1.5px, transparent 1.5px 7px); mask: radial-gradient(circle at 88% 30%, #000 0 45%, transparent 70%); -webkit-mask: radial-gradient(circle at 88% 30%, #000 0 45%, transparent 70%); }
.feature[data-cat="food"]::after { background: repeating-linear-gradient(120deg, rgba(255,255,255,.16) 0 16px, transparent 16px 32px); mask: linear-gradient(200deg, #000 20%, transparent 65%); -webkit-mask: linear-gradient(200deg, #000 20%, transparent 65%); }
.feature[data-cat="health"]::after { background: repeating-linear-gradient(0deg, rgba(255,255,255,.2) 0 1.5px, transparent 1.5px 12px), repeating-linear-gradient(90deg, rgba(255,255,255,.2) 0 1.5px, transparent 1.5px 12px); mask: linear-gradient(210deg, #000 15%, transparent 60%); -webkit-mask: linear-gradient(210deg, #000 15%, transparent 60%); }
.feature[data-cat="volunteer"]::after { background: radial-gradient(rgba(255,255,255,.35) 2px, transparent 2.6px) 0 0/15px 15px; mask: linear-gradient(210deg, #000 15%, transparent 60%); -webkit-mask: linear-gradient(210deg, #000 15%, transparent 60%); }
.feature .kicker { font-size: 11px; font-weight: 700; letter-spacing: .14em; text-transform: uppercase; background: rgba(255,255,255,.16); padding: 5px 10px; border-radius: var(--r-chip); justify-self: start; }
.feature .kicker b { color: var(--gold); }
.feature h3 { font-family: var(--font-display); font-weight: 800; font-size: 22px; line-height: 1.1; letter-spacing: -.015em; margin: 0; text-wrap: balance; }
.feature .meta { font-size: 13.5px; opacity: .92; }

/* Card */
.list { display: grid; gap: 8px; }
.card { display: grid; grid-template-columns: 46px minmax(0, 1fr) 34px; gap: 10px; align-items: start; background: var(--surface); border: 1px solid var(--line); border-radius: var(--r-card); padding: 10px; cursor: pointer; transition: transform .15s ease, box-shadow .15s ease; }
.card:hover { box-shadow: var(--shadow); }
.card:active { transform: scale(.99); }
.stamp { background: var(--cat-soft); color: var(--cat); border-radius: 11px; text-align: center; padding: 6px 2px; display: grid; font-variant-numeric: tabular-nums; }
.stamp .dow { font-size: 10px; font-weight: 700; letter-spacing: .1em; }
.stamp .dd { font-family: var(--font-display); font-weight: 800; font-size: 21px; line-height: 1.05; }
.stamp .mon { font-size: 9.5px; font-weight: 700; letter-spacing: .1em; opacity: .8; }
.stamp.any .dd { font-size: 12px; line-height: 1.7; letter-spacing: .04em; }
.body { min-width: 0; display: grid; gap: 4px; }
.tags { display: flex; flex-wrap: wrap; gap: 4px; }
.ctag { display: inline-flex; align-items: center; gap: 4px; font-size: 11px; font-weight: 700; letter-spacing: .02em; padding: 2px 8px 2px 6px; border-radius: var(--r-chip); background: var(--cat-soft); color: var(--cat); white-space: nowrap; }
.ctag svg { width: 12px; height: 12px; }
.body h4 { margin: 0; font-size: 15.5px; font-weight: 700; line-height: 1.25; text-wrap: balance; overflow-wrap: anywhere; }
.body .where { color: var(--muted); font-size: 13px; overflow-wrap: anywhere; }
.chips { display: flex; flex-wrap: wrap; gap: 5px; margin-top: 2px; }
.chip { font-size: 11.5px; font-weight: 600; padding: 3px 8px; border-radius: var(--r-chip); background: var(--surface-2); color: var(--ink); white-space: nowrap; font-variant-numeric: tabular-nums; }
.chip.free { background: var(--vol-soft); color: var(--vol); }
.chip.warn { background: var(--warn-soft); color: var(--warn); }
.save { border: 0; background: transparent; width: 36px; height: 36px; border-radius: 10px; display: grid; place-items: center; cursor: pointer; color: var(--muted); margin: -4px -4px 0 0; }
.save:hover { background: var(--surface-2); }
.save svg { width: 20px; height: 20px; }
.save[aria-pressed="true"] { color: var(--gold); }
.save[aria-pressed="true"] svg path { fill: currentColor; }

.empty { text-align: center; background: var(--surface); border: 1px dashed var(--line); border-radius: var(--r-card); padding: 28px 18px; display: grid; gap: 8px; justify-items: center; }
.empty strong { font-family: var(--font-display); font-size: 19px; }
.empty p { margin: 0; color: var(--muted); max-width: 34ch; }
.empty button { margin-top: 6px; border: 0; background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r-chip); font-weight: 600; cursor: pointer; }
.footnote { margin: 6px 0 0; font-size: 12.5px; color: var(--muted); text-align: center; text-wrap: balance; }

/* Detail sheet */
.scrim { position: fixed; inset: 0; background: var(--scrim); z-index: 20; opacity: 0; transition: opacity .2s ease; }
.scrim.open { opacity: 1; }
.sheet { position: fixed; left: 0; right: 0; bottom: 0; z-index: 21; max-width: 560px; margin: 0 auto; max-height: 88%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0; padding: 10px max(18px, env(safe-area-inset-right, 0px)) calc(22px + env(safe-area-inset-bottom, 0px)) max(18px, env(safe-area-inset-left, 0px)); transform: translateY(100%); transition: transform .26s cubic-bezier(.2,.8,.2,1); box-sizing: border-box; }
.sheet.open { transform: none; }
.grab { width: 40px; height: 5px; border-radius: 3px; background: var(--line); margin: 0 auto 12px; }
.sheet-band { border-radius: 18px; background: var(--cat-solid); color: #fff; padding: 16px; display: grid; gap: 8px; position: relative; }
.sheet-band .cats { display: flex; gap: 6px; flex-wrap: wrap; }
.sheet-band .cats span { display: inline-flex; align-items: center; gap: 5px; font-size: 11px; font-weight: 700; letter-spacing: .08em; text-transform: uppercase; background: rgba(255,255,255,.18); padding: 4px 9px; border-radius: var(--r-chip); }
.sheet-band .cats svg { width: 13px; height: 13px; }
.sheet-band h2 { margin: 0; font-family: var(--font-display); font-weight: 800; font-size: 24px; line-height: 1.1; text-wrap: balance; padding-right: 36px; }
.close { position: absolute; top: 10px; right: 10px; width: 36px; height: 36px; border: 0; border-radius: 50%; background: rgba(255,255,255,.18); color: #fff; cursor: pointer; display: grid; place-items: center; }
.close svg { width: 18px; height: 18px; }
.facts { margin-top: 14px; display: grid; gap: 12px; }
.fact { display: grid; grid-template-columns: 22px 1fr; gap: 12px; align-items: start; }
.fact svg { width: 20px; height: 20px; color: var(--cat); margin-top: 1px; }
.fact b { display: block; font-weight: 700; }
.fact span { color: var(--muted); font-size: 14px; }
.desc { margin: 16px 0 0; font-size: 15.5px; line-height: 1.55; }
.verify { margin-top: 14px; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 11px 13px; font-size: 14px; display: grid; grid-template-columns: 20px 1fr; gap: 10px; }
.verify svg { width: 18px; height: 18px; margin-top: 1px; }
.actions { margin-top: 18px; display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.act { border: 1px solid var(--line); background: var(--surface); border-radius: 14px; padding: 10px 4px; display: grid; justify-items: center; gap: 4px; font-size: 12px; font-weight: 600; cursor: pointer; color: var(--ink); text-decoration: none; }
.act svg { width: 20px; height: 20px; color: var(--cat); }
.act[aria-pressed="true"] svg path { fill: var(--gold); stroke: var(--gold); }
.primary { margin-top: 10px; display: flex; align-items: center; justify-content: center; gap: 8px; background: var(--cat-solid); color: #fff; text-decoration: none; padding: 14px; border-radius: 14px; font-weight: 700; }
.primary svg { width: 18px; height: 18px; }
.source { margin-top: 12px; font-size: 12.5px; color: var(--muted); text-align: center; }

.toast { position: fixed; left: 50%; bottom: calc(24px + env(safe-area-inset-bottom, 0px)); transform: translate(-50%, 20px); background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: var(--r-chip); font-weight: 600; font-size: 14px; opacity: 0; pointer-events: none; transition: opacity .2s, transform .2s; z-index: 30; }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* Wider screens: rail grows into a labeled sidebar, panels can sit side by side */
@media (min-width: 680px) {
  .logo { height: 62px; }
  .layout { grid-template-columns: 190px minmax(0, 1fr); gap: 20px; }
  .rail-btn { grid-template-columns: 42px 1fr; justify-items: start; align-items: center; text-align: left; padding: 6px 8px; gap: 10px; }
  .rail-btn .tile { width: 42px; height: 40px; border-radius: 13px; }
  .rail-btn .lbl { font-size: 14px; }
  .rail-btn .num { position: static; grid-column: 3; }
  .rail-btn { grid-template-columns: 42px 1fr auto; }
  .rail-btn[aria-current="page"] { background: var(--cat-soft); }
  .card { grid-template-columns: 52px minmax(0, 1fr) 36px; padding: 12px; }
}
@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }
</style>

<div class="app" id="app">
  <header class="top" id="top">

  { base:{ id:"hy", cats:["health"], title:"Yoga in the Park", t:["18:00","19:00"], venue:"Moncus Park", map:"Moncus Park Lafayette LA", free:true, desc:"Free community yoga in the park's Fit For All series, every Wednesday. Bring a mat and water.", source:"Moncus Park", url:"https://moncuspark.org/calendar-events/yoga2026/" }, dates:["2026-11-18","2026-11-25"] },
  { base:{ id:"hm", cats:["health"], title:"Mom Walks", t:["09:30","10:30"], venue:"Veterans Memorial, Moncus Park", map:"Moncus Park Lafayette LA", free:true, desc:"A weekly walk for moms and maternal figures, presented by Lafayette Pediatric Dentistry. Every Wednesday.", source:"Moncus Park", url:"https://moncuspark.org/calendar-events/momwalks2026/" }, dates:["2026-11-18", { d:"2026-11-25", verify:"The park's calendar doesn't show this week. Check before you go." }] },
  { base:{ id:"hs", cats:["health"], title:"Speedwork at the Track", t:["17:00"], venue:"UL Lafayette Track", map:"University of Louisiana at Lafayette track", price:"Members only", desc:"The Cajun Road Runners Club's weekly track workout. Run any distance. Join the club through its RunSignup page.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-17","2026-11-24"] },
  { base:{ id:"ht", cats:["health"], title:"Tap Room Wednesday Run", t:["18:00"], venue:"The Tap Room, River Ranch", map:"The Tap Room River Ranch Lafayette LA", desc:"A social 3.3-mile group run from The Tap Room. Every Wednesday.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-18","2026-11-25"] },
  { base:{ id:"hd", cats:["health"], title:"Thursday at the Dog", t:["18:00"], venue:"Adopted Dog Brewing, 329 Dulles Dr", map:"Adopted Dog Brewing Lafayette LA", desc:"A 3.1-mile group run, then $1 off every beer. Every Thursday.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-19", { d:"2026-11-26", verify:"This is Thanksgiving night. Check that the run is on." }] },
  { base:{ id:"hl", cats:["health"], title:"Saturday Long Run", t:["06:00"], venue:"Red Lerille's back lot, by Moncus Park", map:"Red Lerille's Health and Racquet Club Lafayette LA", desc:"The Cajun Road Runners' weekly long run, starting at 6 AM sharp. Several distances, up to 10+ miles, with water stops at River Ranch, Bendel Gardens and Shannon Rd.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-21","2026-11-28"] },
  { base:{ id:"hr", cats:["health"], title:"Sunday Run Day", t:["17:00"], venue:"Corner Bar, Johnston St", map:"Corner Bar Johnston Street Lafayette LA", desc:"A social 3.5-mile run, and your first beer is free. Every Sunday.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-22","2026-11-29"] },
  { base:{ id:"hk", cats:["health"], title:"Smoothie Monday Run", t:["18:30"], venue:"Smoothie King, 3012 E Milton Ave, Youngsville", map:"Smoothie King 3012 E Milton Ave Youngsville LA", desc:"A 3.1-mile group run from Smoothie King in Youngsville. Every Monday.", source:"Cajun Road Runners", url:"https://cajunroadrunners.com/group-runs/" }, dates:["2026-11-16","2026-11-23","2026-11-30"] }
];
// Early-December dates for the weekly activities (Next 4 Weeks)
const DEC = "Moncus hasn't posted December dates yet. Check before you go.";
const MORE = {
  hy: [{ d:"2026-12-02", verify:DEC }, { d:"2026-12-09", verify:DEC }],
  hm: [{ d:"2026-12-02", verify:DEC }, { d:"2026-12-09", verify:DEC }],
  hs: ["2026-12-01", "2026-12-08"],
  ht: ["2026-12-02", "2026-12-09"],
  hd: ["2026-12-03", "2026-12-10"],
  hl: ["2026-12-05", "2026-12-12"],
  hr: ["2026-12-06", "2026-12-13"],
  hk: ["2026-12-07"]
};
WEEKLY.forEach(({ base, dates }) => dates.concat(MORE[base.id] || []).forEach(x => {
  const d = typeof x === "string" ? { d: x } : x;
  const { t, ...rest } = base;
  const e = { ...rest, id: base.id + d.d.slice(8), start: d.d + "T" + t[0] };
  if (t[1]) e.end = d.d + "T" + t[1];
  if (d.verify) e.verify = d.verify;
  E.push(e);
}));

// ---------- helpers ----------
const DOW = ["Sun","Mon","Tue","Wed","Thu","Fri","Sat"];
const DOW_L = ["Sunday","Monday","Tuesday","Wednesday","Thursday","Friday","Saturday"];
const MON = ["Jan","Feb","Mar","Apr","May","Jun","Jul","Aug","Sep","Oct","Nov","Dec"];
const esc = s => String(s ?? "").replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
function parse(s) {
  if (!s) return null;
  const [d, t] = s.split("T");
  const [y, m, dd] = d.split("-").map(Number);
  const [h, mi] = t ? t.split(":").map(Number) : [0, 0];
  return new Date(y, m - 1, dd, h, mi);
}
const dayOnly = d => new Date(d.getFullYear(), d.getMonth(), d.getDate());
function fmtTime(d) {
  let h = d.getHours(), m = d.getMinutes(), ap = h >= 12 ? "PM" : "AM";
  h = h % 12 || 12;
  return m ? `${h}:${String(m).padStart(2, "0")} ${ap}` : `${h} ${ap}`;
}
function timeLabel(e) {
  if (e.timeNote) return e.timeNote;
  if (e.allDay) return "All day";
  const s = parse(e.start), en = parse(e.end);
  return en ? `${fmtTime(s)} – ${fmtTime(en)}` : fmtTime(s);
}
function relDay(d) {
  const diff = Math.round((dayOnly(d) - TODAY) / 864e5);
  return diff === 0 ? "Today" : diff === 1 ? "Tomorrow" : "";
}
function inRange(e, r) {
  if (e.ongoing) return true;
  const s = dayOnly(parse(e.start)), en = e.endDate ? dayOnly(parse(e.endDate)) : s;
  return s <= r.to && en >= r.from;
}
const matches = (e, q) => !q || (e.title + " " + e.venue + " " + e.desc).toLowerCase().includes(q);
const byStart = (a, b) => parse(a.start) - parse(b.start);

// ---------- state ----------
let saved = new Set();
try { saved = new Set(JSON.parse(localStorage.getItem("csp-saved") || "[]")); } catch (_) {}
function persist() { try { localStorage.setItem("csp-saved", JSON.stringify([...saved])); } catch (_) {} }
const VIEWS = ["all", "music", "food", "volunteer", "health", "saved"];
const fromHash = () => { const h = location.hash.slice(1); return VIEWS.includes(h) ? h : null; };
let state = { view: fromHash() || "all", range: "two", q: "" };
try { const r = localStorage.getItem("csp-range"); if (r && RANGES[r]) state.range = r; } catch (_) {}

// ---------- other icons ----------
const I = {
  save: ICON.saved,
  clock: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></svg>',
  pin: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z"/><circle cx="12" cy="10" r="3"/></svg>',
  tag: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12.6 2.6A2 2 0 0 0 11.2 2H4a2 2 0 0 0-2 2v7.2a2 2 0 0 0 .6 1.4l8.7 8.7a2.4 2.4 0 0 0 3.4 0l6.6-6.6a2.4 2.4 0 0 0 0-3.4z"/><circle cx="7.5" cy="7.5" r="1.5"/></svg>',
  cal: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><rect x="3" y="4" width="18" height="18" rx="2"/><path d="M16 2v4M8 2v4M3 10h18M12 14v4M10 16h4"/></svg>',
  nav: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 19-9-9 19-2-8-8-2z"/></svg>',
  share: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><circle cx="18" cy="5" r="3"/><circle cx="6" cy="12" r="3"/><circle cx="18" cy="19" r="3"/><path d="m8.6 13.5 6.8 4M15.4 6.5l-6.8 4"/></svg>',
  ext: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 3h6v6M10 14 21 3M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h6"/></svg>',
  arrow: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12h14M13 6l6 6-6 6"/></svg>',
  warn: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m21.7 18-8-14a2 2 0 0 0-3.4 0l-8 14A2 2 0 0 0 4 21h16a2 2 0 0 0 1.7-3Z"/><path d="M12 9v4M12 17h.01"/></svg>',
  x: '<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M18 6 6 18M6 6l12 12"/></svg>'
};

// ---------- rendering ----------
const main = document.getElementById("main");
const rail = document.getElementById("rail");

function pool(cat) {
  const r = RANGES[state.range];
  return E.filter(e => e.cats.includes(cat) && inRange(e, r) && matches(e, state.q) && (state.view !== "saved" || saved.has(e.id)));
}
function countDated(cat) {
  const r = RANGES[state.range];
  return E.filter(e => e.cats.includes(cat) && !e.ongoing && inRange(e, r) && matches(e, state.q)).length;
}

function renderRail() {
  const counts = { music: countDated("music"), food: countDated("food"), volunteer: countDated("volunteer"), health: countDated("health") };
  counts.all = new Set(E.filter(e => !e.ongoing && inRange(e, RANGES[state.range]) && matches(e, state.q)).map(e => e.id)).size;
  counts.saved = saved.size;
  rail.innerHTML = RAIL.map((r, i) => `${r.id === "saved" ? "<hr>" : ""}<button class="rail-btn" data-cat="${r.id}" data-view="${r.id}" aria-current="${state.view === r.id ? "page" : "false"}">
      <span class="tile">${ICON[r.id]}</span><span class="lbl">${r.label}</span>${counts[r.id] ? `<span class="num">${counts[r.id]}</span>` : ""}
    </button>`).join("");
}

function tagsFor(e) {
  return e.cats.map(c => `<span class="ctag" data-cat="${c}">${ICON[c]}${CATS[c].tag}</span>`).join("");
}
function priceChip(e) {
  if (e.free) return '<span class="chip free">Free</span>';
  if (e.price) return `<span class="chip">${esc(e.price)}</span>`;
  return "";
}
function card(e, cat) {
  let stamp;
  if (e.ongoing) stamp = `<div class="stamp any"><span class="dow">&nbsp;</span><span class="dd">ANY</span><span class="mon">DAY</span></div>`;
  else { const d = parse(e.start); stamp = `<div class="stamp"><span class="dow">${DOW[d.getDay()].toUpperCase()}</span><span class="dd">${d.getDate()}</span><span class="mon">${MON[d.getMonth()].toUpperCase()}</span></div>`; }
  const multi = e.endDate ? `<span class="chip">Thru ${MON[parse(e.endDate).getMonth()]} ${parse(e.endDate).getDate()}</span>` : "";
  const when = `<span class="chip">${esc(e.ongoing || timeLabel(e))}</span>`;
  const on = saved.has(e.id);
  return `<article class="card" data-cat="${cat}" data-id="${e.id}" tabindex="0" aria-label="${esc(e.title)}">
    ${stamp}
    <div class="body">
      <div class="tags">${tagsFor(e)}</div>
      <h4>${esc(e.title)}</h4>
      <div class="where">${esc(e.venue)}</div>
      <div class="chips">${when}${multi}${priceChip(e)}${e.verify ? '<span class="chip warn">Check details</span>' : ""}</div>
    </div>
    <button class="save" data-save="${e.id}" aria-pressed="${on}" aria-label="${on ? "Remove from saved" : "Save event"}">${I.save}</button>
  </article>`;
}

function dayGroups(items, cat) {
  const groups = [];
  items.forEach(e => {
    const key = dayOnly(parse(e.start)).getTime();
    let g = groups.find(x => x.key === key);
    if (!g) groups.push(g = { key, d: new Date(key), items: [] });
    g.items.push(e);
  });
  return groups.map(g => {
    const rel = relDay(g.d);
    return `<div class="panel-sub">${rel ? `<span class="rel">${rel}</span>` : ""}${DOW[g.d.getDay()]}, ${MON[g.d.getMonth()]} ${g.d.getDate()}</div><div class="list">${g.items.map(e => card(e, cat)).join("")}</div>`;
  }).join("");
}

function panel(cat, { limit = 0, featured = false } = {}) {
  const c = CATS[cat], r = RANGES[state.range];
  const list = pool(cat);
  const dated = list.filter(e => !e.ongoing).sort(byStart);
  const anytime = list.filter(e => e.ongoing);
  if (state.view === "saved" && !list.length) return "";
  let h = `<section class="panel" data-cat="${cat}" aria-label="${c.name}">
    <header class="panel-head"><span class="pi">${ICON[cat]}</span><div class="t"><span class="fr">${c.fr}</span><h2>${c.name}</h2></div><span class="pc">${dated.length} ${r === RANGES.today ? "today" : "upcoming"}</span></header>`;

  const feat = featured && !state.q && dated.find(e => e.featured);
  if (feat) {
    const d = parse(feat.start);
    h += `<article class="feature" data-cat="${cat}" data-id="${feat.id}" tabindex="0" aria-label="Featured: ${esc(feat.title)}">
      <span class="kicker"><b>★</b> Don't miss</span><h3>${esc(feat.title)}</h3>
      <div class="meta">${DOW_L[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()} · ${esc(timeLabel(feat))} · ${esc(feat.venue.split(",")[0])}</div></article>`;
  }

  if (!dated.length && !anytime.length) {
    h += `<div class="panel-empty">${state.q ? "No matches for that search." : `Nothing ${r.label} yet. New ${c.name.toLowerCase()} listings appear as soon as venues post them.`}</div>`;
  } else {
    const shown = limit ? dated.slice(0, limit) : dated;
    if (shown.length) h += dayGroups(shown, cat);
    else if (limit) h += `<div class="panel-empty">No dated events ${r.label}.</div>`;
    if (!limit && anytime.length) h += `<div class="panel-sub">${c.any}</div><div class="list">${anytime.map(e => card(e, cat)).join("")}</div>`;
    const hidden = (dated.length - shown.length) + (limit ? anytime.length : 0);
    if (limit && hidden > 0) h += `<button class="more" data-view="${cat}">See all ${dated.length + anytime.length} in ${c.name} ${I.arrow}</button>`;
  }
  return h + "</section>";
}

function render() {
  const v = state.view, r = RANGES[state.range];
  document.querySelectorAll(".range").forEach(b => b.setAttribute("aria-pressed", b.dataset.range === state.range));
  renderRail();
  let h = "";
  if (v === "all") {
    h += `<div class="intro"><h1>What's happening ${r.label}</h1><p>Music & culture, food, volunteering, and health & wellness, each in its own section.</p></div>`;
    h += ORDER.map(c => panel(c, { limit: 3 })).join("");
  } else if (v === "saved") {
    h += `<div class="intro"><h1>Saved</h1><p>${saved.size ? `Your saved events, sorted by category. Showing ${r.label}.` : "Tap the bookmark on any event to keep it here."}</p></div>`;
    const body = ORDER.map(c => panel(c)).join("");
    h += body || `<div class="empty"><strong>${saved.size ? "No saved events " + r.label : "Nothing saved yet"}</strong><p>${saved.size ? "Try a wider date range." : "Saved events show up here, grouped by category."}</p>${saved.size && state.range !== "two" ? '<button data-wide>Show next 2 weeks</button>' : '<button data-view="all">Browse everything</button>'}</div>`;
  } else {
    h += panel(v, { featured: true });
  }
  h += `<p class="footnote">Prototype with real listings gathered Nov 16, 2026. In the live app, events refresh automatically from each venue's own site.</p>`;
  main.innerHTML = h;
}

// Keep the rail tucked under the sticky header
const headerEl = document.getElementById("top");
function syncHead() { document.documentElement.style.setProperty("--head-h", headerEl.offsetHeight + "px"); }
try { new ResizeObserver(syncHead).observe(headerEl); } catch (_) {}
syncHead();

// ---------- detail sheet ----------
const sheet = document.getElementById("sheet"), scrim = document.getElementById("scrim");
let lastFocus = null;
function calUrl(e) {
  const pad = n => String(n).padStart(2, "0");
  const f = d => `${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}`;
  const s = parse(e.start);
  let dates;
  if (e.allDay) { const n = new Date(s); n.setDate(n.getDate() + 1); dates = `${f(s)}/${f(n)}`; }
  else { const en = parse(e.end) || new Date(s.getTime() + 2 * 3600e3); const t = d => `${f(d)}T${pad(d.getHours())}${pad(d.getMinutes())}00`; dates = `${t(s)}/${t(en)}`; }
  const p = new URLSearchParams({ action: "TEMPLATE", text: e.title, dates, ctz: "America/Chicago", location: e.venue, details: e.desc + (e.url ? "\n\n" + e.url : "") });
  return "https://calendar.google.com/calendar/render?" + p.toString();
}
function openSheet(id, cat) {
  const e = E.find(x => x.id === id); if (!e) return;
  sheet.dataset.cat = cat && e.cats.includes(cat) ? cat : e.cats[0];
  let whenMain, whenSub;
  if (e.ongoing) { whenMain = e.ongoing; whenSub = "No set date"; }
  else {
    const d = parse(e.start), ed = e.endDate && parse(e.endDate);
    whenMain = `${DOW_L[d.getDay()]}, ${MON[d.getMonth()]} ${d.getDate()}` + (ed ? ` – ${DOW_L[ed.getDay()]}, ${MON[ed.getMonth()]} ${ed.getDate()}` : "");
    whenSub = timeLabel(e) + (relDay(d) ? ` · ${relDay(d)}` : "");
  }
  const on = saved.has(e.id);
  const maps = "https://www.google.com/maps/search/?api=1&query=" + encodeURIComponent(e.map || e.venue);
  sheet.innerHTML = `<div class="grab"></div>
    <div class="sheet-band">
      <div class="cats">${e.cats.map(c => `<span>${ICON[c]}${CATS[c].tag}</span>`).join("")}</div>
      <h2 id="sheet-title">${esc(e.title)}</h2>
      <button class="close" data-close aria-label="Close">${I.x}</button>
    </div>
    <div class="facts">
      <div class="fact">${I.clock}<div><b>${esc(whenMain)}</b><span>${esc(whenSub)}</span></div></div>
      <div class="fact">${I.pin}<div><b>${esc(e.venue)}</b><span>Lafayette area</span></div></div>
      <div class="fact">${I.tag}<div><b>${esc(e.free ? "Free" : e.price || "See listing")}</b><span>${e.free ? "No ticket needed" : "Prices from the venue's listing"}</span></div></div>
    </div>
    <p class="desc">${esc(e.desc)}</p>
    ${e.verify ? `<div class="verify">${I.warn}<div>${esc(e.verify)}</div></div>` : ""}
    <div class="actions">
      <button class="act" data-save="${e.id}" aria-pressed="${on}">${I.save}${on ? "Saved" : "Save"}</button>
      ${e.ongoing ? `<span class="act" aria-disabled="true" style="opacity:.45">${I.cal}Calendar</span>` : `<a class="act" href="${esc(calUrl(e))}" target="_blank" rel="noopener">${I.cal}Calendar</a>`}
      <a class="act" href="${esc(maps)}" target="_blank" rel="noopener">${I.nav}Directions</a>
      <button class="act" data-share="${e.id}">${I.share}Share</button>
    </div>
    ${e.url ? `<a class="primary" href="${esc(e.url)}" target="_blank" rel="noopener">Open on ${esc(e.source)} ${I.ext}</a>` : ""}
    <p class="source">From ${esc(e.source)} · checked Nov 16, 2026</p>`;
  lastFocus = document.activeElement;
  scrim.hidden = false; sheet.hidden = false;
  requestAnimationFrame(() => { scrim.classList.add("open"); sheet.classList.add("open"); sheet.querySelector("[data-close]").focus(); });
}
function closeSheet() {
  scrim.classList.remove("open"); sheet.classList.remove("open");
  setTimeout(() => { scrim.hidden = true; sheet.hidden = true; }, 220);
  lastFocus?.focus?.();
}

// ---------- toast ----------
const toast = document.getElementById("toast"); let tt;
function say(msg) { toast.textContent = msg; toast.classList.add("show"); clearTimeout(tt); tt = setTimeout(() => toast.classList.remove("show"), 1800); }

function toggleSave(id) {
  if (saved.has(id)) { saved.delete(id); say("Removed from Saved"); } else { saved.add(id); say("Saved"); }
  persist(); render();
  if (!sheet.hidden) {
    const b = sheet.querySelector(`[data-save="${id}"]`);
    if (b) { const on = saved.has(id); b.setAttribute("aria-pressed", on); b.innerHTML = I.save + (on ? "Saved" : "Save"); }
  }
}
function go(view) {
  if (location.hash.slice(1) === view) { state.view = view; render(); }
  else location.hash = view;
}
function setRange(r) { state.range = r; try { localStorage.setItem("csp-range", r); } catch (_) {} render(); }

// ---------- events ----------
document.addEventListener("click", ev => {
  const t = ev.target;
  const sv = t.closest("[data-save]"); if (sv) { ev.stopPropagation(); toggleSave(sv.dataset.save); return; }
  const sh = t.closest("[data-share]");
  if (sh) {
    const e = E.find(x => x.id === sh.dataset.share);
    const d = e.ongoing ? e.ongoing : `${DOW[parse(e.start).getDay()]} ${MON[parse(e.start).getMonth()]} ${parse(e.start).getDate()}, ${timeLabel(e)}`;
    const text = `${e.title} · ${d} · ${e.venue}${e.url ? "\n" + e.url : ""}`;
    try { navigator.clipboard.writeText(text).then(() => say("Copied. Paste it in a text."), () => say("Couldn't copy on this device")); } catch (_) { say("Couldn't copy on this device"); }
    return;
  }
  if (t.closest("[data-close]") || t === scrim) { closeSheet(); return; }
  if (t.closest("[data-wide]")) { setRange("two"); return; }
  const rg = t.closest(".range"); if (rg) { setRange(rg.dataset.range); return; }
  const vw = t.closest("[data-view]"); if (vw) { go(vw.dataset.view); window.scrollTo({ top: 0 }); return; }
  const cd = t.closest(".card, .feature"); if (cd) openSheet(cd.dataset.id, cd.dataset.cat);
});
document.addEventListener("keydown", ev => {
  if (ev.key === "Escape" && !sheet.hidden) closeSheet();
  if ((ev.key === "Enter" || ev.key === " ") && ev.target.matches(".card, .feature")) { ev.preventDefault(); openSheet(ev.target.dataset.id, ev.target.dataset.cat); }
});
document.getElementById("q").addEventListener("input", ev => { state.q = ev.target.value.trim().toLowerCase(); render(); });
window.addEventListener("hashchange", () => { state.view = fromHash() || "all"; render(); });

render();
</script>
